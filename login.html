<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login to TheaterBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-purple-500 to-indigo-600 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full space-y-6">
    <h2 class="text-2xl font-bold text-center text-gray-800">🎭 Welcome to TheaterBot</h2>
    
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Username</label>
        <input type="text" id="username" required
               class="w-full mt-1 p-3 border rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" required
               class="w-full mt-1 p-3 border rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>

      <button type="submit"
              class="w-full bg-purple-600 hover:bg-purple-700 text-white p-3 rounded-xl font-semibold transition">
        Log In
      </button>

      <p id="error" class="text-red-500 text-center hidden">Invalid credentials.</p>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorText = document.getElementById('error');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      // Dummy validation
      if (username === "admin" && password === "theater123") {
        window.location.href = "index.html";  // Redirect to chatbot
      } else {
        errorText.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
